<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mauvaise Continuité</title>
  <style>
    body {
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      border: 2px solid #00ff00;
      padding: 24px 32px;
      background-color: #030803;
      max-width: 650px;
      width: 100%;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 20px 0;
      letter-spacing: -0.5px;
      text-transform: lowercase;
      text-align: center;
      border-bottom: 1px dashed #00ff00;
      padding-bottom: 15px;
    }
    h2 {
      font-size: 13px;
      text-transform: uppercase;
      background-color: #002200;
      border: 1px solid #00ff00;
      padding: 4px 8px;
      margin: 25px 0 12px 0;
    }
    a {
      color: #00ff00;
      text-decoration: underline;
      font-weight: bold;
    }
    a:hover {
      background-color: #00ff00;
      color: #000000;
      text-decoration: none;
    }
    .episode {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px dotted #004400;
    }
    .episode:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .ep-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }
    audio {
      width: 100%;
      height: 32px;
      filter: invert(100%) hue-rotate(90deg);
    }
    #status {
      font-size: 12px;
      text-align: center;
      color: #00aa00;
    }
    .blog-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 14px;
    }
    .blog-list li {
      padding: 5px 0;
      border-bottom: 1px dotted #004400;
    }
    .blog-list li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>bienvenue à mauvaise continuité</h1>

    <h2>épisodes</h2>
    <div id="episodes"><div id="status">en lecture</div></div>

    <h2>chroniques de 2200</h2>
    <ul class="blog-list">
      <li>> <a href="blog/bulletin-01.html">bulletin 1: manifeste de mauvaise continuité</a></li>
    </ul>
  </div>

  <script>
    const RSS_URL = 'https://media.rss.com/mauvaise-continuite/feed.xml';

    fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS_URL))
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('episodes');
        if (!data.items || data.items.length === 0) {
          container.innerHTML = '<div id="status">aucune publication active</div>';
          return;
        }
        container.innerHTML = data.items.map(ep => `
          <div class="episode">
            <div class="ep-title">> ${ep.title}</div>
            <audio controls preload="none" src="${ep.enclosure.link}"></audio>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('status').innerText = '// erreur de connexion au relais.';
      });
  </script>

</body>
</html>
